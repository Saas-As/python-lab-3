services:
  db:
    image: postgres:16-alpine
    container_name: quotes-db
    restart: always
    environment:
      POSTGRES_USER: quotes_user
      POSTGRES_PASSWORD: quotes_pass
      POSTGRES_DB: quotes_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotes_user -d quotes_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: quotes-web
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://quotes_user:quotes_pass@db:5432/quotes_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: